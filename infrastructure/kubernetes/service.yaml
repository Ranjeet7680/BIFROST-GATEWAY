apiVersion: v1
kind: Service
metadata:
  name: bifrost-gateway
  namespace: bifrost-system
  labels:
    app.kubernetes.io/name: bifrost-gateway
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app: bifrost-gateway
