<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="rfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040509" />
      <stop offset="50%" stop-color="#080A12" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(13,16,28,0.9)" />
      <stop offset="100%" stop-color="rgba(8,10,18,0.9)" />
    </linearGradient>

    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#rfBg)" rx="16" />
  <rect x="1" y="1" width="1198" height="678" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" rx="16" />

  <!-- Title Header -->
  <g transform="translate(60, 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#2997FF" letter-spacing="1.5">INTELLIGENT ROUTER &amp; RELIABILITY ENGINE</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Dynamic Request Lifecycle &amp; Zero-Downtime Failover Flow</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">How Bifrost intercepts, caches, secures, routes, and automatically recovers in under 18ms</text>
  </g>

  <!-- ==================== FLOW COLUMNS ==================== -->

  <!-- STEP 1: CLIENT INGRESS -->
  <g transform="translate(60, 140)">
    <rect width="170" height="110" rx="12" fill="url(#cardBg)" stroke="rgba(41,151,255,0.4)" stroke-width="1.5" />
    <text x="16" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#2997FF">STEP 01</text>
    <text x="16" y="48" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Client Request</text>
    <text x="16" y="68" font-family="monospace" font-size="10" fill="#94A3B8">POST /v1/chat/completions</text>
    <text x="16" y="86" font-family="-apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Authorization: Bearer vk_live...</text>
  </g>

  <!-- Connection 1 -> 2 -->
  <path d="M 230 195 L 280 195" fill="none" stroke="#2997FF" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="280,195 273,191 273,199" fill="#2997FF" />

  <!-- STEP 2: SECURITY & VIRTUAL KEY -->
  <g transform="translate(285, 140)">
    <rect width="180" height="110" rx="12" fill="url(#cardBg)" stroke="rgba(0,245,255,0.4)" stroke-width="1.5" />
    <text x="16" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#00F5FF">STEP 02</text>
    <text x="16" y="48" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Security &amp; Auth</text>
    <text x="16" y="68" font-family="-apple-system, sans-serif" font-size="10" fill="#10B981">✓ Virtual Key Valid</text>
    <text x="16" y="84" font-family="-apple-system, sans-serif" font-size="10" fill="#10B981">✓ Rate Limit: 42/1200 RPM</text>
    <text x="16" y="100" font-family="-apple-system, sans-serif" font-size="10" fill="#10B981">✓ PII Sanitized (0 leaks)</text>
  </g>

  <!-- Connection 2 -> 3 -->
  <path d="M 465 195 L 515 195" fill="none" stroke="#00F5FF" stroke-width="2" />
  <polygon points="515,195 508,191 508,199" fill="#00F5FF" />

  <!-- STEP 3: SEMANTIC CACHE LOOKUP -->
  <g transform="translate(520, 140)">
    <rect width="190" height="110" rx="12" fill="url(#cardBg)" stroke="rgba(168,85,247,0.4)" stroke-width="1.5" />
    <text x="16" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#A855F7">STEP 03</text>
    <text x="16" y="48" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">pgvector Cache</text>
    <text x="16" y="68" font-family="-apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Vector Cosine Distance</text>
    <text x="16" y="84" font-family="monospace" font-size="10" fill="#A855F7">Threshold: &gt; 0.92</text>
    <text x="16" y="100" font-family="-apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Lookup Time: 3.2ms</text>
  </g>

  <!-- Branch A: Cache HIT -> Instant Return -->
  <path d="M 615 140 L 615 80 L 1020 80 L 1020 135" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4" />
  <rect x="760" y="68" width="130" height="24" rx="6" fill="#0B261D" stroke="#10B981" stroke-width="1" />
  <text x="825" y="84" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#10B981">CACHE HIT (3.8ms)</text>

  <!-- Connection 3 -> 4 (Cache Miss) -->
  <path d="M 710 195 L 760 195" fill="none" stroke="#A855F7" stroke-width="2" />
  <polygon points="760,195 753,191 753,199" fill="#A855F7" />
  <text x="735" y="188" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">Miss</text>

  <!-- STEP 4: INTELLIGENT ROUTER DECISION -->
  <g transform="translate(765, 140)">
    <rect width="190" height="110" rx="12" fill="url(#cardBg)" stroke="rgba(245,158,11,0.4)" stroke-width="1.5" />
    <text x="16" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#F59E0B">STEP 04</text>
    <text x="16" y="48" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Model Router</text>
    <text x="16" y="68" font-family="-apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Policy: 'auto-best'</text>
    <text x="16" y="84" font-family="-apple-system, sans-serif" font-size="10" fill="#F59E0B">Primary: OpenAI GPT-4o</text>
    <text x="16" y="100" font-family="-apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Decision: 1.8ms</text>
  </g>

  <!-- Connection Router -> Primary Provider (Downwards) -->
  <path d="M 860 250 L 860 330" fill="none" stroke="#F59E0B" stroke-width="2" />
  <polygon points="860,330 856,323 864,323" fill="#F59E0B" />

  <!-- ==================== FAILURE & FAILOVER ENGINE ==================== -->

  <!-- STEP 5: PRIMARY PROVIDER OUTAGE -->
  <g transform="translate(720, 335)">
    <rect width="280" height="115" rx="12" fill="rgba(42,14,20,0.85)" stroke="#F43F5E" stroke-width="2" filter="url(#glowRed)" />
    <text x="16" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#F43F5E">STEP 05: PRIMARY ATTEMPT</text>
    <text x="16" y="48" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">OpenAI GPT-4o Cluster</text>
    <rect x="16" y="58" width="248" height="22" rx="4" fill="rgba(244,63,94,0.2)" />
    <text x="24" y="73" font-family="monospace" font-size="10" font-weight="700" fill="#F43F5E">HTTP 503 SERVICE UNAVAILABLE</text>
    <text x="16" y="98" font-family="-apple-system, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.7)">Rate limit / upstream outage detected</text>
  </g>

  <!-- Failover Circuit Trip Curve -->
  <path d="M 720 395 C 640 395, 640 500, 560 500" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-dasharray="5,4" />
  <rect x="580" y="430" width="140" height="26" rx="6" fill="#1C090D" stroke="#F43F5E" stroke-width="1" />
  <text x="650" y="447" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#F43F5E">CIRCUIT BREAKER TRIP</text>

  <!-- STEP 6: AUTOMATIC ZERO-DOWNTIME FAILOVER -->
  <g transform="translate(260, 440)">
    <rect width="300" height="120" rx="12" fill="rgba(10,30,22,0.85)" stroke="#10B981" stroke-width="2" filter="url(#glowGreen)" />
    <text x="16" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#10B981">STEP 06: AUTOMATED FALLBACK</text>
    <text x="16" y="48" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Anthropic Claude 3.5 Sonnet</text>
    <rect x="16" y="58" width="268" height="22" rx="4" fill="rgba(16,185,129,0.2)" />
    <text x="24" y="73" font-family="monospace" font-size="10" font-weight="700" fill="#10B981">HTTP 200 OK • FAILOVER TOOK 18ms</text>
    <text x="16" y="98" font-family="-apple-system, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.7)">Zero client downtime • Equivalent benchmark tier</text>
  </g>

  <!-- Connection to Final Return -->
  <path d="M 560 500 L 980 500 L 980 250" fill="none" stroke="#10B981" stroke-width="2" />
  <polygon points="980,250 976,257 984,257" fill="#10B981" />

  <!-- STEP 7: RESPONSE NORMALIZATION & TELEMETRY -->
  <g transform="translate(980, 140)">
    <rect width="160" height="110" rx="12" fill="url(#cardBg)" stroke="rgba(16,185,129,0.5)" stroke-width="1.5" />
    <text x="16" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#10B981">FINAL RETURN</text>
    <text x="16" y="48" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">200 OK Client</text>
    <text x="16" y="68" font-family="-apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)">Normalized Payload</text>
    <text x="16" y="84" font-family="monospace" font-size="10" fill="#2997FF">OTel Span Emitted</text>
    <text x="16" y="100" font-family="monospace" font-size="10" fill="#10B981">Zero App Disruption</text>
  </g>

  <!-- Summary Footer Note -->
  <g transform="translate(60, 620)">
    <rect width="1080" height="38" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="20" y="23" font-family="-apple-system, sans-serif" font-size="11.5" fill="rgba(255,255,255,0.6)">
      <tspan font-weight="700" fill="#2997FF">Reliability Guarantee:</tspan> All upstream failures (HTTP 429, 500, 502, 503, timeouts) are caught at the intelligence layer. Fallbacks resolve within &lt; 20ms without surfacing errors to end users.
    </text>
  </g>
</svg>
