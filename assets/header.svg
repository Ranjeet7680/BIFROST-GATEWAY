<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030408" />
      <stop offset="50%" stop-color="#080A12" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>

    <!-- Electric Cyan/Blue Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2997FF" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#0071E3" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#030408" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#030408" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#030408" stop-opacity="0" />
    </radialGradient>

    <!-- Prismatic Logo Gradient -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#2997FF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2997FF" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />
  <rect width="1200" height="420" fill="url(#centerGlow)" />
  <rect width="1200" height="420" fill="url(#purpleGlow)" />
  <rect width="1200" height="420" fill="url(#emeraldGlow)" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Top Release Pill -->
  <g transform="translate(600, 52)">
    <rect x="-170" y="-14" width="340" height="28" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(41,151,255,0.3)" stroke-width="1" />
    <circle cx="-145" cy="0" r="4" fill="#2997FF" filter="url(#glowFilter)" />
    <text x="-132" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#2997FF" letter-spacing="1">BIFROST v2.4</text>
    <text x="-32" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">|</text>
    <text x="-20" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.85)">ENTERPRISE AI GATEWAY PLATFORM</text>
  </g>

  <!-- Central Logo Emblem -->
  <g transform="translate(600, 130)">
    <!-- Glowing Ring Orbits -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="rgba(41,151,255,0.15)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="36" fill="rgba(10,14,24,0.85)" stroke="url(#prismGrad)" stroke-width="2" filter="url(#glowFilter)" />

    <!-- Prismatic Bifrost Layers Icon -->
    <path d="M 0 -16 L 18 -7 L 0 2 L -18 -7 Z" fill="#60A5FA" opacity="0.95" />
    <path d="M -18 -1 L 0 8 L 18 -1 L 18 4 L 0 13 L -18 4 Z" fill="#2997FF" opacity="0.85" />
    <path d="M -18 7 L 0 16 L 18 7 L 18 12 L 0 21 L -18 12 Z" fill="#A855F7" opacity="0.8" />
  </g>

  <!-- Main Headline -->
  <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">
    BIFROST GATEWAY
  </text>

  <!-- Subheadline -->
  <text x="600" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="url(#cyanBlueGrad)" letter-spacing="0">
    One Gateway. Every AI. Infinite Possibilities.
  </text>

  <!-- Tagline / Value Proposition -->
  <text x="600" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="rgba(255,255,255,0.6)" letter-spacing="0.2">
    Unified API • Intelligent Model Routing • 18ms Automatic Failover • Semantic Cache • Enterprise Virtual Keys • MCP Bridge
  </text>

  <!-- Feature Badges -->
  <g transform="translate(600, 360)">
    <!-- Badge 1: < 4ms Latency -->
    <g transform="translate(-330, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#2997FF">&lt; 4ms Overhead</text>
    </g>

    <!-- Badge 2: 72% Cost Savings -->
    <g transform="translate(-165, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#10B981">-72% Token Spend</text>
    </g>

    <!-- Badge 3: 15+ Providers -->
    <g transform="translate(0, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#00F5FF">15+ AI Providers</text>
    </g>

    <!-- Badge 4: Zero Downtime SLA -->
    <g transform="translate(165, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#F59E0B">99.99% Uptime SLA</text>
    </g>

    <!-- Badge 5: Apache 2.0 -->
    <g transform="translate(330, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#A855F7">Apache 2.0 License</text>
    </g>
  </g>
</svg>
